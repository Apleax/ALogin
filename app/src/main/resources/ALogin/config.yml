# 服务器名字
ServerName: QinServer

# 服务端口
server:
  # 前端登录地址，用于生成登陆链接
  address: "https://example.xyz/Login"
  # 后端服务端口
  port: 8080
#  ssl:
#    keyStore: "classpath:https.jks"
#    keyPassword: ""

minestom:
  # 内置Minestom服务端口
  port: 25565
  # 登陆成功后跳转服务器地址
  transfer: "localhost:25566"
  # 转移服务器使用的CookieKey，与目标服务器配置相对应
  cookie-key: "alogin"
  # MineSkinApiKey 用于服务器皮肤支持
  mineskin-api-key: ""
  minimotd:
    - line1: "<rainbow>[ 不风采的破服 ]  1.21.11~26.2（现已提供基岩版支持）</rainbow>"
      line2: "<italic><gradient:blue:red>tips: 动物在瞧瞧看着你，你转身时，它会假装没看见</gradient></italic>"
    - line1: "<blue>[不风采的破服] 版本1.21.11~26.2（现已提供基岩版支持）<bold><red>"
      line2: "<italic><underlined><gradient:red:yellow>tips: 苦力怕是我们的好朋友，如果你不嫌弃它的“爆炸性欢迎”"

# 跨域白名单：凭证模式(withCredentials)下不能用 "*"，必须列出具体源，多个用英文逗号分隔
cross.allow-origin: "https://www.example.com,https://example.com"

solon.logging:
  appender:
    # 控制台日志输出级别
    console:
      level: INFO
      enable: true #是否启用

sa-token:
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: false
  # 是否打印鉴权相关操作日志
  is-log: false
  # Cookie 作用域设为父域，即允许所有子域名共享Cookie
  # 为空即不设置Cookie域
  cookie:
    domain: "example.com"

# 邮箱配置块
EmailConfig:
  # 提供邮件发送服务的服务器
  HostName: "smtp.example.com"
  # 发件人信息
  From:
    # 发件人邮箱
    Email: "example@example.com"
    # 发件人昵称
    Name: "Apleax"
  # 邮件服务器登录认证信息
  Authentication:
    UserName: "example@example.com"
    Password: "your key"
  # 邮件服务器端口
  Port: 465

# 数据库配置块
DataBase:
  # 填写数据库用户名密码后开启，密钥留空生成密钥和脱敏数据
  vault:
    enabled: false
    password: ""
  # 可选数据库: MYSQL,SQLSERVER
  choose: MYSQL
  host: localhost
  port: 3306
  database: alogin
  username: root
  password: 123456
  # 完整的JDBC连接字符串
  # JDBC连接字符串不为空时，将忽略除 username 与 password 以外的其他数据库配置
  jdbc: ""

Security:
  encryption:
    # 加密算法: SHA256, SHA512, Argon2
    algorithm: SHA512

# 正版（微软设备码授权 + 免密断言）配置块
# 设备码授权借用 Minecraft 启动器官方凭据，无需 Azure 应用注册，因此没有 oauth 配置项
Premium:
  # 正版免密断言（B 路线）：由 ViaProxy 插件回传的 HMAC 签名断言
  assertion:
    # 总开关；关闭或未配置 secret 时完全不发挑战，行为与现状一致
    enabled: true
    # 与 ViaProxy 插件共享的密钥（openssl rand -hex 32 生成；值当口令保密）
    secret: ""
    # 与插件约定的登录插件消息通道
    channel: "alogin:premium"
    # 等待插件应答的超时毫秒数，必须小于 5000（否则 Minestom 会因超时踢人）
    timeout-ms: 3500
    # 断言时间戳允许的时钟偏移（秒）
    clock-skew-seconds: 120