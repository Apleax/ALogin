<!-- 皮肤上传失败提醒邮件模板：占位符 <servername/> <account/> <reason/> <time/> -->
<style>
    .mail td {
        font-family: "Segoe UI", sans-serif;
        text-align: center;
        font-size: 16px;
        color: #718096;
    }

    .mail th, div, p, a, h1, h2, h3, h4, h5, h6 {
        font-family: "Segoe UI", sans-serif;
        text-align: center;
        color: #3d4852;
    }

    .mail .mail-content {
        max-width: 100vw;
        padding: 32px;
        box-shadow: 0 15px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.25);
    }

    .mail div {
        background-color: #ffffff;
        color: #718096;
        height: 100%;
        line-height: 1.4;
        width: 100%;
    }

    .mail .x_wrapper {
        background-color: #edf2f7;
        width: 100%;
    }

    .mail .x_content {
        width: 100%;
    }

    .mail .x_inner-body {
        background-color: #ffffff;
        border-color: #e8e5ef;
        border-radius: 2px;
        border-width: 1px;
        margin: 0 auto;
        padding: 0;
        width: 570px;
    }

    .mail .x_content-cell {
        margin: 0 auto;
        padding: 0;
        width: 570px;
        line-height: 1.5em;
        color: #b0adc5;
        font-size: 12px;
    }

    .mail .x_content-cell td {
        max-width: 100vw;
        padding: 32px;
    }

    .mail .reason-box {
        width: 100%;
        border-collapse: collapse;
        margin: 16px 0;
    }

    .mail .reason-box td {
        padding: 12px;
        border: 1px solid #e8e5ef;
        font-size: 14px;
        text-align: center;
        background-color: #fff5f5;
        color: #c53030;
    }

    .mail .alert {
        color: #e53e3e;
        font-weight: bold;
    }
</style>
<div class="mail">
    <div>
        <table class="x_wrapper">
            <tbody>
            <tr>
                <td>
                    <table class="x_content">
                        <tbody>
                        <tr>
                            <td style="padding: 25px 0;">
                                <h1 style="font-size: 20px;">皮肤上传失败</h1>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <table class="x_inner-body">
                                    <tbody>
                                    <tr>
                                        <td class="mail-content">
                                            <h1 style="font-size: 18px;margin-bottom: 25px;">ALogin ·
                                                <servername/>
                                            </h1>
                                            <hr>
                                            <table style="width: 100%;">
                                                <tbody>
                                                <tr>
                                                    <td>
                                                        您的账号 <strong><account/></strong> 于
                                                        <strong><time/></strong>
                                                        上传的皮肤<span class="alert">处理失败</span>。
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td>
                                                        <table class="reason-box">
                                                            <tbody>
                                                            <tr>
                                                                <td>失败原因：<reason/></td>
                                                            </tr>
                                                            </tbody>
                                                        </table>
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td style="font-size: 14px;">
                                                        请确认皮肤为 64x64 的 PNG 图片后重新上传；若多次失败请联系管理员。
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td>
                                                        <small>
                                                            <br/>请勿回复
                                                        </small>
                                                    </td>
                                                </tr>
                                                </tbody>
                                            </table>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <table class="x_content-cell">
                                    <tbody>
                                    <tr>
                                        <td>
                                            <p style="color:#b0adc5;">© 2025 Apleax. All rights reserved.</p>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
