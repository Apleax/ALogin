solon:
  threads.virtual.enabled: true #启用虚拟线程池（默认false）
  app:
    name: 'ALogin'
    group: 'xyz.apleax'
    version: @project.version@

solon.logging.appender:
  # 控制台日志输出级别
  console:
    level: INFO
  # 文件日志输出级别
  file:
    enable: true
    level: DEBUG
    name: "logs/${solon.app.name}"
    extension: ".log"
    maxFileSize: "10 MB"
    maxHistory: "7"

server:
  http:
    gzip:
      enable: true
      minSize: 4096 #最小多少大小才启用（默认 4k）
      mimeTypes: 'text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml'
      coreThreads: 0
      maxThreads: 0
  request:
    maxFileSize: 20mb

############## Sa-Token 配置 (文档: https://sa-token.com/) ##############
sa-token:
  token-name: AToken
  token-style: uuid
  # Token过期时间
  timeout: 2592000
  # Token冻结时间
  active-timeout: 172800
  is-share: false
  is-concurrent: false
  # 自动续签
  auto-renew: true
  isPrint: false
  isColorLog: true

# 配置数据源对应的 mybatis 信息（要与 DataSource bean 的名字对上）
mybatis:
  DataBase:
    typeAliases: #支持包名 或 类名（大写开头 或 *）//支持 ** 或 * 占位符
      - "xyz.apleax.ALogin.Entity.PO.*"
    typeHandlers: #支持包名 或 类名（大写开头 或 *）//支持 ** 或 * 占位符
      - "xyz.apleax.ALogin.TypeHandler.*"
    mappers: #支持包名 或 类名（大写开头 或 *）或 xml（.xml结尾）//支持 ** 或 * 占位符
      - "xyz.apleax.ALogin.SQL.Mapper.*"
    configuration: #扩展配置（要与 MybatisConfiguration 类的属性一一对应）
      cacheEnabled: false
      mapperVerifyEnabled: true #如果为 true，则要求所有 mapper 有 @Mapper 主解
      mapUnderscoreToCamelCase: true
      logImpl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    globalConfig: #全局配置（要与 GlobalConfig 类的属性一一对应）
      banner: false