name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # geyser-extension 与 viaproxy-plugin 依赖外部快照仓库/本地安装的 jar，在 CI 中不可构建，故不纳入
      - name: Build and test
        run: mvn -B -pl entity,core,server,app -am clean test
